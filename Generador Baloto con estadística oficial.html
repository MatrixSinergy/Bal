<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Generador Baloto con estadística oficial</title>
<style>
:root{--bg:#f7f6f2;--fg:#14183a;--mut:#5b6080;--card:#fff;--ln:#dcdce6;--hi:#1a237e;--lo:#a9b0e0;--ball:#f5c542;--sb:#d33a2c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1226;--fg:#eceefc;--mut:#a3a8cf;--card:#181c3a;--ln:#2a2f5c;--hi:#ffd93d;--lo:#4a53a5;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1226;--fg:#eceefc;--mut:#a3a8cf;--card:#181c3a;--ln:#2a2f5c;--hi:#ffd93d;--lo:#4a53a5;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 "Avenir Next","Segoe UI",system-ui,sans-serif;padding:16px;max-width:640px;margin-inline:auto}
h1{font-size:1.4rem;margin:.2em 0}h2{font-size:1.05rem;margin:1em 0 .4em}
p,label,small{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px;margin:12px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid label{display:flex;flex-direction:column;font-size:.85rem;gap:2px}
select,input[type=range]{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:4px}
.chk{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:.9rem}
button{font:inherit;font-weight:600;border:0;border-radius:999px;padding:10px 20px;background:var(--hi);color:var(--bg);cursor:pointer;margin-top:12px}
.line{display:flex;gap:6px;align-items:center;margin:8px 0;flex-wrap:wrap}
.b{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--ball);color:#2b2200}
.b.s{background:var(--sb);color:#fff}
.tag{font-size:.78rem;color:var(--mut);margin-left:4px}
.bars{display:flex;align-items:flex-end;gap:1px;height:90px;border-bottom:1px solid var(--ln)}
.bars i{flex:1;background:var(--lo);min-height:1px}.bars i.m{background:var(--hi)}
.ax{display:flex;justify-content:space-between;font-size:.75rem;color:var(--mut)}
</style>
</head>
<body>
<h1>Generador Baloto</h1>
<p>Pesos según 19 sorteos oficiales (Baloto y Revancha) y cobertura del tramo 28–39, que el automático de la página nunca genera.</p>

<div class="card">
<div class="grid">
<label>Combinaciones <select id="n"><option>1</option><option selected>5</option><option>10</option></select></label>
<label>Suavizado <span><input id="suav" type="range" min="0" max="3" step="0.5" value="0.5"> <span id="sv">0.5</span></span></label>
<label>Mínimo en 28–39 <select id="vmin"><option>0</option><option selected>1</option><option>2</option><option>3</option></select></label>
<label>Máximo en 28–39 <select id="vmax"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select></label>
<label>Máximo en 40–43 <select id="alt"><option>0</option><option selected>1</option><option>2</option></select></label>
</div>
<label class="chk"><input id="par" type="checkbox" checked> 2 o 3 impares</label>
<label class="chk"><input id="sbu" type="checkbox"> Superbalota uniforme</label>
<button id="gen">Generar</button>
<div id="out"></div>
</div>

<div class="card"><h2>Frecuencia oficial por número</h2><div id="bars"></div><small>Azul fuerte: tramo 28–39. 190 bolas en 19 sorteos.</small></div>

<script>
const N=43,K=5;
const OF=[2,2,2,4,2,7,3,3,4,4,6,3,5,4,5,4,6,4,6,2,4,3,6,7,4,5,0,10,6,8,2,3,7,6,4,4,4,5,3,5,7,4,5];
const SBO=[0,3,2,2,2,0,4,4,2,4,0,4,3,4,1,3];
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
function pick(w,k){w=w.slice();const o=[];for(let t=0;t<k;t++){const s=w.reduce((a,b)=>a+b,0);let r=Math.random()*s,i=0;while(i<w.length-1&&(r-=w[i])>=0)i++;o.push(i+1);w[i]=0}return o.sort((a,b)=>a-b)}
function P(){const lo=+$("vmin").value;return{s:+$("suav").value,lo,hi:Math.max(lo,+$("vmax").value),al:+$("alt").value,par:$("par").checked,sbu:$("sbu").checked}}
function valida(c,p){const v=c.filter(n=>n>=28&&n<=39).length,a=c.filter(n=>n>=40).length,i=c.filter(n=>n%2).length;return v>=p.lo&&v<=p.hi&&a<=p.al&&(!p.par||(i>=2&&i<=3))}
function gen(p){const w=OF.map(x=>x+p.s),sw=SBO.map(x=>p.sbu?1:x+p.s);for(let t=0;t<20000;t++){const c=pick(w,K);if(valida(c,p))return[c,pick(sw,1)[0]]}return null}
$("suav").oninput=()=>$("sv").textContent=$("suav").value;
$("gen").onclick=()=>{const p=P(),n=+$("n").value,vistas=new Set(),filas=[];
for(let t=0;t<n*50&&filas.length<n;t++){const r=gen(p);if(!r)break;const k=r[0].join("-")+"|"+r[1];if(vistas.has(k))continue;vistas.add(k);filas.push(r)}
$("out").innerHTML=filas.length?filas.map(([c,s])=>`<div class="line">${c.map(x=>`<span class="b">${pad(x)}</span>`).join("")}<span class="b s">${pad(s)}</span><span class="tag">28–39: ${c.filter(x=>x>=28&&x<=39).length}</span></div>`).join(""):"<p>Con esas reglas no se pudo armar una combinación. Relaja algún límite.</p>"};
const mx=Math.max(...OF);
$("bars").innerHTML='<div class="bars">'+OF.map((x,i)=>`<i class="${i>=27&&i<39?"m":""}" style="height:${100*x/mx}%" title="${i+1}: ${x}"></i>`).join("")+'</div><div class="ax"><span>1</span><span>43</span></div>';
$("gen").click();
</script>
</body>
</html>
